name: Android CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Rust tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path rust-core/Cargo.toml

      - name: Configure Android NDK linkers
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android24-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$toolchain/armv7a-linux-androideabi24-clang"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi24-clang"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "AR_armv7_linux_androideabi=$toolchain/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build Rust Android libraries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust-core/Cargo.toml --release --target aarch64-linux-android
          cargo build --locked --manifest-path rust-core/Cargo.toml --release --target armv7-linux-androideabi
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          install -m 0644 rust-core/target/aarch64-linux-android/release/libtgwsproxy.so android/app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so
          install -m 0644 rust-core/target/armv7-linux-androideabi/release/libtgwsproxy.so android/app/src/main/jniLibs/armeabi-v7a/libtgwsproxy.so

      - name: Run Android unit tests and build debug/release APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
