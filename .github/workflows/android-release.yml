name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish signed Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Validate release tag and app version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          app_version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$app_version" != "$tag_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android versionName ${app_version:-<missing>}." >&2
            exit 1
          fi
          if [[ -z "$app_version_code" ]]; then
            echo "Android versionCode is missing or not a literal integer." >&2
            exit 1
          fi
          {
            echo "APP_VERSION=$app_version"
            echo "APP_VERSION_CODE=$app_version_code"
          } >> "$GITHUB_ENV"
          echo "Building WS Proxy ${app_version} (versionCode ${app_version_code})"

      - name: Configure Android NDK linkers
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android24-clang"
          test -x "$toolchain/armv7a-linux-androideabi24-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android24-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$toolchain/armv7a-linux-androideabi24-clang"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi24-clang"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "AR_armv7_linux_androideabi=$toolchain/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build Rust native libraries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust-core/Cargo.toml --release --target aarch64-linux-android
          cargo build --locked --manifest-path rust-core/Cargo.toml --release --target armv7-linux-androideabi

          llvm_nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for target in aarch64-linux-android armv7-linux-androideabi; do
            library="rust-core/target/${target}/release/libtgwsproxy.so"
            test -s "$library"
            "$llvm_nm" --dynamic --defined-only "$library" > "/tmp/${target}-symbols.txt"
            for symbol in StartProxy GetStatsJson GetProxyHealth ResetRouteFailures; do
              if ! grep -Eq "[[:space:]]${symbol}$" "/tmp/${target}-symbols.txt"; then
                echo "Missing required Rust export ${symbol} in ${target}" >&2
                exit 1
              fi
            done
          done

          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          install -m 0644 rust-core/target/aarch64-linux-android/release/libtgwsproxy.so android/app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so
          install -m 0644 rust-core/target/armv7-linux-androideabi/release/libtgwsproxy.so android/app/src/main/jniLibs/armeabi-v7a/libtgwsproxy.so

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: ${name}" >&2
              exit 1
            fi
          done

          umask 077
          mkdir -p android/keystore
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/keystore/ws-proxy-release.p12
          test -s android/keystore/ws-proxy-release.p12

          keytool -list \
            -storetype PKCS12 \
            -keystore android/keystore/ws-proxy-release.p12 \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              return (value.replace("\\", "\\\\")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace("#", "\\#")
                           .replace("!", "\\!")
                           .replace(" ", "\\ "))

          values = {
              "storeFile": "keystore/ws-proxy-release.p12",
              "storeType": "PKCS12",
              "storePassword": os.environ["ANDROID_RELEASE_STORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_RELEASE_KEY_PASSWORD"],
          }
          Path("android/keystore.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in values.items()),
              encoding="ascii",
          )
          PY

      - name: Build signed Release APKs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify APKs and create checksums
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="android/app/build/outputs/apk/release"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"

          expected=(
            "app-arm64-v8a-release.apk"
            "app-armeabi-v7a-release.apk"
            "app-universal-release.apk"
          )
          for name in "${expected[@]}"; do
            test -s "$apk_dir/$name"
          done

          expected_fingerprint=""
          for apk in "$apk_dir"/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" > "/tmp/$(basename "$apk").signature.txt"
            fingerprint="$(sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([0-9A-Fa-f]+).*/\1/p' "/tmp/$(basename "$apk").signature.txt" | head -n 1)"
            if [[ -z "$fingerprint" ]]; then
              echo "Could not read signing certificate fingerprint from $(basename "$apk")" >&2
              exit 1
            fi
            if [[ -z "$expected_fingerprint" ]]; then
              expected_fingerprint="$fingerprint"
            elif [[ "$fingerprint" != "$expected_fingerprint" ]]; then
              echo "APK variants were signed by different certificates." >&2
              exit 1
            fi

            badging="$("$aapt" dump badging "$apk")"
            grep -Fq "name='com.tgwsproxy.merged'" <<< "$badging"
            grep -Fq "versionCode='${APP_VERSION_CODE}'" <<< "$badging"
            grep -Fq "versionName='${APP_VERSION}'" <<< "$badging"
          done

          arm64_listing="$(unzip -l "$apk_dir/app-arm64-v8a-release.apk")"
          arm32_listing="$(unzip -l "$apk_dir/app-armeabi-v7a-release.apk")"
          universal_listing="$(unzip -l "$apk_dir/app-universal-release.apk")"
          grep -Fq "lib/arm64-v8a/libtgwsproxy.so" <<< "$arm64_listing"
          grep -Fq "lib/armeabi-v7a/libtgwsproxy.so" <<< "$arm32_listing"
          grep -Fq "lib/arm64-v8a/libtgwsproxy.so" <<< "$universal_listing"
          grep -Fq "lib/armeabi-v7a/libtgwsproxy.so" <<< "$universal_listing"

          (cd "$apk_dir" && sha256sum *.apk > SHA256SUMS.txt)
          echo "Verified signer SHA-256: $expected_fingerprint"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WS Proxy ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
